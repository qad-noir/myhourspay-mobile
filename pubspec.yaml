name: myhourspay
description: "MyHoursPay companion app — native mobile companion."
publish_to: 'none'
version: 0.1.0+7

environment:
  sdk: ^3.13.2

dependencies:
  calendar_date_picker2: 3.0.0
  device_info_plus: 13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: 7.2.0
  http: ^1.6.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/providers/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
